services:
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["mail"]
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  ollama:
    image: ollama/ollama:0.12.6
    ports: ["127.0.0.1:${OLLAMA_PORT:-11434}:11434"]
    volumes: ["ollama_data:/root/.ollama"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "env", "OLLAMA_HOST=http://127.0.0.1:11434", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dailybrief}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dailybrief}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ollama_data:
  redis_data:
  postgres_data:
